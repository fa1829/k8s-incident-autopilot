[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101", "S603", "S607", "E731", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
